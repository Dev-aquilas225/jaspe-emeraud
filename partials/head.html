<!-- =====================================================================
     partials/head.html — canonical <head> boilerplate (copy EXACTLY).
     Replace the {{PLACEHOLDERS}} only. Keep the order:
     meta → SEO → icons → inline boot script (BEFORE any CSS) → fonts → CSS → JS.
     {{FILE}}      e.g. english-camp.html   (index → leave empty: https://jaspe-emeraudegroup.com/)
     {{TITLE_FR}}  e.g. English Camp — L’anglais qui se vit · Jaspe-Émeraude Group
     {{TITLE_EN}}  e.g. English Camp — English you live · Jaspe-Émeraude Group
     {{DESC}}      French meta description, ~150 characters
     {{OG_IMAGE}}  e.g. assets/img/photos/camp-02.webp
     {{PAGE}}      page key for optional page CSS/JS (delete those 2 lines if unused)
     <html> tag:   <html lang="fr" class="no-js">
     ===================================================================== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-en="{{TITLE_EN}}">{{TITLE_FR}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="https://jaspe-emeraudegroup.com/{{FILE}}">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0E0D" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jaspe-Émeraude Group">
<meta property="og:title" content="{{TITLE_FR}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="https://jaspe-emeraudegroup.com/{{FILE}}">
<meta property="og:image" content="https://jaspe-emeraudegroup.com/{{OG_IMAGE}}">
<meta property="og:locale" content="fr_CI">
<meta property="og:locale:alternate" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<script>(function(d,w){var h=d.documentElement,c=h.classList;c.remove('no-js');c.add('js');try{var l=w.localStorage.getItem('je-lang');if(l==='en'){c.add('lang-en');h.lang='en'}var t=w.localStorage.getItem('je-theme');if(t==='dark'||(!t&&w.matchMedia&&w.matchMedia('(prefers-color-scheme: dark)').matches))c.add('dark')}catch(e){}try{if(w.sessionStorage.getItem('jeg-visited'))c.add('is-returning')}catch(e){}})(document,window);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/pages/{{PAGE}}.css">
<script defer src="assets/js/main.js"></script>
<script defer src="assets/js/app.js"></script>
<script defer src="assets/js/pages/{{PAGE}}.js"></script>
