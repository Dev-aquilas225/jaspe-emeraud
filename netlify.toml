# Jaspe-Émeraude Group — configuration Netlify (site statique, aucune compilation)
# Doc : https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# ---------------------------------------------------------------------------
# Fichiers internes du dépôt : jamais servis (404)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/partials/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Page introuvable : toute adresse sans fichier → 404.html (statut 404).
# 404.html calcule elle-même sa <base href>, elle s’affiche donc correctement
# à n’importe quelle profondeur d’URL.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------------------------
# En-têtes de sécurité (toutes les pages)
# Pas de Content-Security-Policy : elle devrait autoriser Google Fonts,
# docs.google.com, drive.google.com, *.googleusercontent.com et
# api.web3forms.com — à ajouter seulement après un test complet.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    X-Frame-Options = "SAMEORIGIN"

# ---------------------------------------------------------------------------
# Cache
# Images (photos, logos, icônes) : cache long (1 an). Si vous remplacez une
# image, donnez-lui un NOUVEAU nom de fichier, sinon certains visiteurs
# garderont l’ancienne.
# CSS / JS : leurs noms ne changent pas d’une version à l’autre, on garde donc
# un cache court (1 h, puis revalidation) pour que chaque mise à jour du site
# soit visible rapidement.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
